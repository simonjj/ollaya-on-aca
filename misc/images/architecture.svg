<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">Ollaya routing architecture on Azure Container Apps</title>
  <desc id="desc">OpenCode sends requests to an Azure Container Apps router. The router asks Ollaya for a trivial, normal, or hard decision and forwards the request to GPT-5.6 Luna or Sol.</desc>
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #2563eb; stroke-width: 3; rx: 18; }
      .decision { fill: #eff6ff; stroke: #0284c7; stroke-width: 3; rx: 18; }
      .model { fill: #f0fdf4; stroke: #16a34a; stroke-width: 3; rx: 18; }
      .label { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 17px "Segoe UI", Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .route { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .line { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1180" height="620" fill="#f8fafc"/>
  <rect class="box" x="55" y="245" width="210" height="120"/>
  <text class="label" x="160" y="295">OpenCode</text>
  <text class="small" x="160" y="328">Responses API client</text>

  <rect class="box" x="345" y="220" width="250" height="170"/>
  <text class="label" x="470" y="270">Routing gateway</text>
  <text class="small" x="470" y="305">Azure Container Apps</text>
  <text class="small" x="470" y="335">Managed identity</text>
  <text class="small" x="470" y="365">Usage metrics</text>

  <rect class="decision" x="680" y="60" width="250" height="130"/>
  <text class="label" x="805" y="110">Ollaya + Laya</text>
  <text class="small" x="805" y="143">Typed decision model</text>
  <text class="small" x="805" y="169">trivial · normal · hard</text>

  <rect class="model" x="955" y="245" width="190" height="110"/>
  <text class="label" x="1050" y="290">GPT-5.6 Luna</text>
  <text class="small" x="1050" y="323">trivial</text>

  <rect class="model" x="955" y="405" width="190" height="140"/>
  <text class="label" x="1050" y="452">GPT-5.6 Sol</text>
  <text class="small" x="1050" y="486">normal: medium</text>
  <text class="small" x="1050" y="515">hard: high</text>

  <path class="line" d="M265 305 H345"/>
  <path class="line" d="M595 260 C635 230 650 175 680 145"/>
  <path class="line" d="M930 125 C1010 125 1050 175 1050 245"/>
  <path class="line" d="M595 330 C755 330 795 300 955 300"/>
  <path class="line" d="M595 360 C770 405 805 475 955 475"/>

  <text class="route" x="725" y="295">trivial</text>
  <text class="route" x="755" y="395">normal / hard</text>
  <text class="small" x="495" y="425">Classification stays local to your ACA environment.</text>
</svg>
